name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    env:
      REQUIRE_NATIVE_TESTS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.401'
      - run: python build_player.py
      - run: python verify.py
      - run: python package_release.py --out releases/Photon-Pretzel-0.4.0-win-x64.zip
      - name: Require independent packaged execution
        shell: pwsh
        run: |
          $receipt = Get-Content releases/Photon-Pretzel-0.4.0-win-x64.build.json | ConvertFrom-Json
          if ($receipt.execution_validation.status -ne 'passed') { throw 'Packaged execution must pass' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Photon-Pretzel-0.4.0-win-x64
          path: releases/Photon-Pretzel-0.4.0-win-x64.zip
          if-no-files-found: error
